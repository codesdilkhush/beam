name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Build and Check Frontend
        run: |
          cd frontend
          bun install
          bun run check
          bun run build

      - name: Run Go Formatting Check and Vet
        run: |
          test -z "$(gofmt -s -l .)" || (echo "Unformatted Go code detected:" && gofmt -s -l . && exit 1)
          go vet ./...

      - name: Run Backend Unit Tests
        run: |
          go test -race -count=1 -v ./backend/...

      - name: Verify Go Build
        run: |
          go build -tags webkit2_41 -o /dev/null .
